<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Official Model United Nations Committee Portal chaired by Kartik Nandal Sir.">
  <title>MUN Committee | Kartik Nandal Sir</title>

  <!--
    ==========================================================================
    UNCSW // EXECUTIVE BOARD SIGNAL ARCHIVE
    "Observe everything, EVERYTHING."
    Channel passive. Field Guidance Terminal responds only to OBSERVE
    or five consecutive taps on the Chair's epigraph.
    ==========================================================================
  -->

  <style>
    /* ==========================================================================
       1. Design Tokens & Base Reset
       ========================================================================== */
    :root {
      --bg-primary: #050507;
      --bg-secondary: #0c0c10;
      --surface: #121218;
      --surface-elevated: #171720;
      --border: #262632;
      --border-strong: #3b3b4d;
      --text-primary: #ffffff;
      --text-secondary: #b8b8c6;
      --text-dim: #7f7f91;
      --accent-live: #22c55e;
      --accent-amber: #f59e0b;
      --accent-danger: #ef4444;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-soft: 0 20px 50px rgba(0, 0, 0, 0.55);
      --transition-fast: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      --transition-reveal: 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      --nav-height: 72px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--nav-height) + 16px);
      background-color: var(--bg-primary);
    }

    body {
      background-color: var(--bg-primary);
      background-image:
        radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.045) 0%, transparent 42%),
        radial-gradient(circle at 85% 38%, rgba(255, 255, 255, 0.03) 0%, transparent 45%);
      color: var(--text-primary);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.65;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      width: min(1120px, 90%);
      margin: 0 auto;
    }

    /* Accessible Focus Ring */
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--text-primary);
      outline-offset: 3px;
    }

    /* ==========================================================================
       2. Sticky Glassmorphic Navigation Bar
       ========================================================================== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      min-height: var(--nav-height);
      background: rgba(5, 5, 7, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: var(--nav-height);
      gap: 1rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.14em;
      font-size: 0.85rem;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-primary);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }

    .nav-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.42rem 0.85rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ==========================================================================
       3. Header / Chair Profile Section
       ========================================================================== */
    .hero {
      padding: 5rem 0 4.5rem;
      border-bottom: 1px solid var(--border);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 3.5rem;
    }

    .portrait-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .portrait-frame {
      position: relative;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(145deg, #4b4b5e 0%, #1c1c26 48%, #363646 100%);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.8),
        inset 0 1px 1px rgba(255, 255, 255, 0.25),
        0 0 0 1px var(--border-strong);
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
    }

    .portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      border-radius: 50%;
      display: block;
      background-color: var(--surface);
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .portrait-frame:hover img {
      transform: scale(1.03);
    }

    /* Subtle hover-only tooltip badge for optional photo swap */
    .portrait-hover-badge {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%) translateY(6px);
      background: rgba(5, 5, 7, 0.84);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
    }

    .portrait-frame:hover .portrait-hover-badge,
    .portrait-frame:focus-visible .portrait-hover-badge {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text-secondary);
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      margin-bottom: 1.1rem;
    }

    .hero-title {
      font-size: clamp(2.4rem, 5.2vw, 3.85rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 0.85rem;
    }

    .tagline {
      font-size: clamp(1.15rem, 2.3vw, 1.5rem);
      font-weight: 500;
      color: #ececf5;
      letter-spacing: 0.01em;
      margin-bottom: 1.75rem;
      user-select: none;
      -webkit-user-select: none;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      margin-top: 1.75rem;
    }

    /* ==========================================================================
       4. Shared Buttons & Section Layout
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      min-height: 48px;
      padding: 0.85rem 1.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-decoration: none;
      cursor: pointer;
      transition: transform var(--transition-fast), background-color var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .btn-primary {
      background-color: var(--text-primary);
      color: var(--bg-primary);
      border: 1px solid var(--text-primary);
      box-shadow: 0 10px 28px rgba(255, 255, 255, 0.12);
    }

    .btn-primary:hover {
      background-color: transparent;
      color: var(--text-primary);
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(255, 255, 255, 0.08);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
    }

    .btn-outline:hover {
      border-color: var(--text-primary);
      background-color: rgba(255, 255, 255, 0.07);
      transform: translateY(-2px);
    }

    .section {
      padding: 5rem 0;
    }

    .section-alt {
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .section-header {
      margin-bottom: 2.75rem;
    }

    .section-kicker {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text-dim);
      margin-bottom: 0.55rem;
    }

    .section-title {
      font-size: clamp(1.75rem, 3.2vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.85rem;
    }

    .section-lead {
      color: var(--text-secondary);
      max-width: 68ch;
      font-size: 1.02rem;
    }

    /* ==========================================================================
       5. Hero Live New Delhi (IST) Synced Countdown Box
       ========================================================================== */
    .ist-timer-box {
      background: linear-gradient(180deg, var(--surface) 0%, #0c0c12 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.35rem 1.6rem;
      max-width: 540px;
      box-shadow: var(--shadow-soft);
      position: relative;
    }

    .ist-timer-box::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    }

    .ist-box-label {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 0.65rem;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-live);
      position: relative;
      flex-shrink: 0;
    }

    .pulse-dot::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--accent-live);
      opacity: 0.75;
      animation: pulseRing 1.8s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }

    @keyframes pulseRing {
      0% {
        transform: scale(0.75);
        opacity: 0.85;
      }
      100% {
        transform: scale(1.9);
        opacity: 0;
      }
    }

    .countdown-readout {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.45rem;
      font-size: clamp(1.95rem, 4.2vw, 2.75rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      margin-bottom: 0.65rem;
    }

    .cd-unit-wrap {
      display: inline-flex;
      align-items: baseline;
    }

    .cd-unit-wrap.hidden {
      display: none;
    }

    .cd-suffix {
      font-size: 0.48em;
      font-weight: 600;
      color: var(--text-secondary);
      margin-left: 0.12rem;
    }

    .cd-sep {
      color: var(--text-dim);
      font-weight: 600;
    }

    .ist-target-line {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.2rem;
    }

    .ist-live-line {
      font-size: 0.82rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .session-live-banner {
      display: none;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-sm);
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.4);
      margin-bottom: 0.65rem;
    }

    .session-live-banner.visible {
      display: block;
    }

    .session-live-banner strong {
      display: block;
      font-size: 1.05rem;
      color: var(--text-primary);
    }

    .session-live-banner span {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* ==========================================================================
       6. Mandate & Protocol Cards
       ========================================================================== */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 2rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      transition: transform var(--transition-fast), border-color var(--transition-fast), background-color var(--transition-fast);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--text-primary);
      background-color: var(--surface-elevated);
    }

    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--bg-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }

    .card h3 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .card p {
